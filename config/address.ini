# Device connection settings for Python's configparser.ConfigParser.
# Values are strings; read numeric ports with getint().
# USB vendor and product IDs are hexadecimal; convert with int(value, 16).

[router]
# Main router and its web control panel port.
host = 192.168.0.1
web_port = 8443

[main_control_computer]
# Computer running the main robot controller.
host = 192.168.0.2

[development_computer]
# This development computer. Not used for control in production.
host = 192.168.0.3

[car_1_camera]
# Car 1 is on the lowest floor
# Camera address and complete RTSP stream URL.
host = 192.168.0.5
mac = 84:FC:14:B8:76:41
rtsp_url = rtsp://192.168.0.5/0

[car_2_camera]
# Car 2 is on the platform floor and up
host = 192.168.0.6
mac = 84:FC:14:B8:75:8A
rtsp_url = rtsp://192.168.0.6/0

[car_3_camera]
# Car 3
host = 192.168.0.7
mac = 84:FC:14:B8:75:9C
rtsp_url = rtsp://192.168.0.7/0

[car_4_camera]
# Car 4 is on top floors
host = 192.168.0.8
mac = 84:FC:14:B8:75:AA
rtsp_url = rtsp://192.168.0.8/0

[car_5_camera]
# Car 5 is a spare
host = 192.168.0.9
mac = 84:FC:14:B8:75:9A
rtsp_url = rtsp://192.168.0.9/0

[car_6_camera]
# Car 6 is a spare
host = 192.168.0.10
mac = 84:FC:14:B8:75:95
rtsp_url = rtsp://192.168.0.10/0

[telemetry_modem]
# Match these USB identifiers during serial-port discovery.
serial_port = COM11
usb_vendor_id = 303A
usb_product_id = 1001
usb_serial_number = 68:EE:8F:46:33:44

[joystick]
# Current Windows serial port and hardware identifier as reported.
serial_port = COM1
pnp_device_id = ACPI/PNP0501/0

[robotic_arm]
# Planned robotic arm address.
host = 192.168.0.10

[car_1_display]
display_index = 2

[car_2_display]
display_index = 3

[car_3_display]
display_index = 0

[car_4_display]
display_index = 1

[car_1_control]
forward_button = 0
left_button = 1
right_button = 2

[car_2_control]
forward_button = 3
left_button = 4
right_button = 5

[car_3_control]
forward_button = 6
left_button = 7
right_button = 8

[car_4_control]
forward_button = 9
left_button = 10
right_button = 11

[admin_keyboard_shotcut]
admin_toggle_button = 'K_ESCAPE'
admin_select_car_1_button = 'K_1'
admin_select_car_2_button = 'K_2'
admin_select_car_3_button = 'K_3'
admin_select_car_4_button = 'K_4'
admin_quit_button = 'K_Q'
admin_car_control_forward_button = "K_UP"
admin_car_control_left_button = "K_LEFT"
admin_car_control_right_button = "K_RIGHT"
admin_car_control_backward_button = "K_DOWN"
admin_manual_control_modifier_button = "K_LCTRL"

