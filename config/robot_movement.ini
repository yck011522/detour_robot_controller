# Shared robot movement settings for zones A, B, C and D.
# All zones use the same thresholds because their mechanism geometry is similar.
# Compliance teaching and full-distance withdrawal trials, 2026-11-18.
# The game controller's robot process (game_controller/robot) loads this file.
# The E14 experiments load it too.
#
# Ranges below are conservative tuning suggestions, NOT validated safety limits.
# Keep tested values initially. Changes require supervised fixture testing.
# No warning thresholds: measurements are logged; failure conditions stop action.
# A failure stop means stop tool/motion, end force mode, and block progression.
# It does not request a UR controller protective stop or reset one automatically.
# Poses remain in robot_pose.ini; calibrated payloads remain in game_config.ini.

[joint_motion]
# Leading-axis joint speed, degrees/second. Doubled from the E14-tested 5 on
# 2026-11-15 by operator decision; the doubled speed is NOT yet validated on the
# robot, so the first live runs need supervision. Also used for startup jogging.
speed_deg_s = 20.0
# Joint acceleration, degrees/second squared. Tested: 10; suggested test range 5-10.
acceleration_deg_s2 = 10.0
# Maximum absolute error on EACH joint, preserving taught joint winding.
# Degrees. Agreed: 2; suggested tuning range 1-2. Arrival also requires stopped
# asynchronous motion and stationary feedback; position proximity alone is not arrival.
arrival_tolerance_deg = 2.0
# Maximum absolute speed on EACH joint for stationary recognition, rad/second.
# Tested: 0.01; suggested range 0.005-0.01, subject to feedback noise.
stationary_velocity_rad_s = 0.01
# Wait after motion has ended and stationary feedback begins BEFORE comparing Q.
# Seconds. Agreed: 0.2; suggested range 0.2-0.5. Restart if motion resumes.
settle_seconds = 0.2
# Minimum additional dwell between completed sequence steps, seconds.
# Agreed: 0.5; suggested range 0.5-1.0. Distinct from arrival settling above.
step_dwell_seconds = 0.5
# Maximum duration of a single tested B/D joint leg, seconds; stop if incomplete.
# Tested legs took up to 28.5 s. Keep 60 initially; longer cross-home routes need
# their own timing validation rather than assuming this limit is sufficient.
timeout_seconds = 60.0

[cross_home]
# Only directed transfers between bd_home and ac_home use this speed, deg/s.
# Doubled from the E14-tested 10 by operator decision; not yet validated.
# Observed joint speed was about half the command; scaling was not logged.
# Acceleration, stationary checks, settling and dwell use [joint_motion].
speed_deg_s = 30.0
# Large taught rotations need more time than local zone legs. Seconds per leg.
# The first loaded BD->AC transfer completed using this 120-second limit.
timeout_seconds = 120.0

[compliance]
# Base-frame XYZ compliant during tightening, Z only during withdrawal.
axial_limit_n = 80
lateral_limit_n = 40
xy_limit_mm = 3
# Maximum speed on EACH compliant translational axis, mm/second.
# Tested: 5; suggested supervised range 1-5. Slower values may require more time.
translation_speed_mm_s = 5.0
# Permitted orientation deviation on noncompliant rotational axes, degrees.
# Existing tested forceMode limits: 2. Keep 2 initially; this is a controller
# deviation setting, not an additional application orientation-warning threshold.
orientation_deviation_deg = 2.0
# Never reapply payload merely to initialize a step: setPayload re-zeros FT.
# Preserve payload and sensor reference through engagement/release. Apply the new
# supported-load payload only after release, stopped and disengaged, at zone-high after retreat.
preserve_payload_during_operation = true

[tightening]
# Both M1 pickup tightening and M2 placement tightening use base -Z force.
# Magnitude in N (positive setting, applied downward). Tested/recommended: 10.
# Keep 10 initially; no wider force range has been validated on this mechanism.
downward_force_n = 10.0
# Normal completion: a fresh STALLED report from the selected motor. No minimum
# target depth, force-feedback threshold or application motor-current threshold.
# Failure: downward travel STRICTLY GREATER THAN this value, relative to actual
# TCP Z at the beginning of this action. mm. Agreed maximum: 20; successful tests
# descended 4.5-5.5 mm. Keep 20; do not increase without fixture travel validation.
max_downward_displacement_mm = 20.0
# Failure if no successful tightening within this duration, seconds.
# Agreed: 30; observed success 2.2-3.0. Keep 30 initially, not a warning timer.
timeout_seconds = 30.0

[release]
# Keep selected motor LOOSENING and Z compliance active until normal target
# height is reached OR the timeout expires. Starting Z is captured ONCE at the
# beginning of the action, not reset every tick or on a pause/resume.
# Upward TCP displacement for immediate normal completion, mm. Agreed: 20;
# suggested tuning range 10-20, always >= min_accepted_upward_displacement_mm.
target_upward_displacement_mm = 20.0
# At timeout ONLY: actual final upward displacement >= this value is accepted
# as completion, even if target height was not reached. < this value is failure:
# stop motor/motion, end force mode, block progression for admin recovery.
# Use displacement at timeout, NOT the greatest height seen earlier.
# Full withdrawal required even at timeout.
min_accepted_upward_displacement_mm = 20.0
# Seconds. Agreed: 30; successful full releases took about 4.2-4.4.
# At expiry apply the minimum-height rule above; do not run indefinitely.
timeout_seconds = 30.0

[placement_release]
# M1 loosens to detach empty tool from the installed floor; M2 remains idle.
# Upward commanded force magnitude, N, with loaded payload/reference preserved.
upward_force_n = 15.0

[pickup_release]
# M2 loosens to detach floor from structure; M1 remains securely attached/idle.
# Upward commanded force magnitude, N, with tool-only payload/reference preserved.
# Tested/recommended: 15. At 10 N, one test reached only ~10 mm in 30 s; at 15 N,
# B/D both passed 20 mm in ~4.3 s. 10-15 is the explored range; use 15 initially.
# Higher values have not been tested. Revisit if plate mass or tare policy changes.
upward_force_n = 15.0

[runtime]
# Existing test-runner timings, moved out of code WITHOUT changing their values.
# These are communication/stop settings, not extra mechanical warning thresholds.
# Receive stream frequency, Hz. Tested: 125; retain 125 initially.
receive_hz = 125.0
# Minimum loop sleep, seconds. Tested: 0.02; tool reply time also contributes to
# actual loop duration. Retain 0.02 rather than assuming a hard 50 Hz loop.
loop_sleep_seconds = 0.02
# Position/force log interval, seconds. Tested: 0.2 (~5 Hz); retain for comparison.
sample_interval_seconds = 0.2
# Maximum age without an advancing controller timestamp, seconds. Existing: 0.5.
# Retain initially; increasing this delays detection of stale feedback.
feedback_timeout_seconds = 0.5
# Maximum tool request/reply wait, seconds. Existing: 0.4; retain initially.
tool_reply_timeout_seconds = 0.4
# Robot watchdog minimum servicing frequency, Hz. Existing: 3; retain initially.
watchdog_min_hz = 3.0
# Pause after an explicitly requested FT zero, seconds. Existing: 0.2.
ft_zero_settle_seconds = 0.2
# Joint stop deceleration, rad/s^2. Existing: 1.0; retain until separately tested.
stop_joint_deceleration_rad_s2 = 1.0
# Cartesian stop deceleration, m/s^2. Existing: 0.1; retain until separately tested.
stop_linear_deceleration_m_s2 = 0.1
# Numerical comparison tolerance for configured payload properties (not physical
# mass uncertainty). Existing: 0.00001 kg for mass and metres for CoG.
payload_mass_tolerance_kg = 0.00001
payload_cog_tolerance_m = 0.00001

[queue_test]
# Experimental coverage policy, separate from the production board scheduler.
# Every directed pair must appear exactly once. Skip invalid pairs in place;
# move a pair to the back only after successful placement and return home.
transfer_order = B>D, A>C, D>B, C>A, A>D, B>C, D>A, C>B, A>B, C>D, B>A, D>C
# Startup recognition only: maximum error on EACH joint, degrees.
# Requested: 5. Does not change the 2-degree movement arrival tolerance.
startup_home_tolerance_deg = 5.0
# Keyboard polling interval, seconds. P toggles pause between sub-steps;
# Q requests controlled quit after the current operation returns to either home.
# Quit takes priority over pause so the remaining retreat can finish.
keyboard_poll_seconds = 0.1
