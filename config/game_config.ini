# Runtime behavior. Connection addresses, COM ports, buttons and keys stay in address.ini.
# M1 is a bench/diagnostic profile: no zone scheduling, UR or tool control.

[m1]
# Reservation presence starts checked for all cars; change it in the admin UI.
# Presence does not gate driving. M1 has no reservation scheduler yet.
present_cars = 1, 2, 3, 4
start_in_admin = true

[timing]
# Agreed control cadence; display timing is independent.
control_hz = 50
display_fps = 60
ui_snapshot_hz = 50
telemetry_stale_s = 0.5
echo_stale_s = 0.5
keyboard_stale_s = 0.3
# Never deliver stale driving intent if the controller stalls.
command_expiry_s = 0.15
modem_retry_s = 1.0
video_stale_s = 1.0
camera_retry_s = 2.0
shutdown_stop_s = 0.6
metrics_interval_s = 5.0

[ui]
# Gray wash over live video: 0 (disabled) to 255 (opaque).
video_wash_alpha = 0

[coins]
# Tags with video_id are gold; other track tags are silver.
silver_points = 1
gold_points = 10
respawn_seconds = 120

[logging]
directory = logs/m1

# Calibrated payloads; CoG in metres relative to the robot tool flange.
# Stored for robot experiments/future integration; M1 does not apply these.
[robot_payload_tool_only]
mass_kg = 1.190
cog_x_m = -0.003
cog_y_m = 0.044
cog_z_m = 0.000

[robot_payload_tool_with_floor]
mass_kg = 2.110
cog_x_m = -0.001
cog_y_m = 0.035
cog_z_m = 0.026
