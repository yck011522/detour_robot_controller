# Runtime behavior. Connection addresses, COM ports, buttons and keys stay in address.ini.
# M1 is a bench/diagnostic profile: no map, zone scheduling, UR or tool control.

[m1]
# Others are physically off for the current test. Presence can change in admin UI.
present_cars = 1
start_in_admin = true

[timing]
# Agreed control cadence; display timing is independent.
control_hz = 50
display_fps = 30
ui_snapshot_hz = 10
telemetry_stale_s = 0.5
echo_stale_s = 0.5
keyboard_stale_s = 0.3
# Never deliver stale driving intent if the controller stalls.
command_expiry_s = 0.15
modem_retry_s = 1.0
video_stale_s = 1.0
camera_retry_s = 2.0
shutdown_stop_s = 0.6
metrics_interval_s = 5.0

[logging]
directory = logs/m1

# Calibrated payloads; CoG in metres relative to the robot tool flange.
# Stored for robot experiments/future integration; M1 does not apply these.
[robot_payload_tool_only]
mass_kg = 1.190
cog_x_m = -0.003
cog_y_m = 0.044
cog_z_m = 0.000

[robot_payload_tool_with_floor]
mass_kg = 2.110
cog_x_m = -0.001
cog_y_m = 0.035
cog_z_m = 0.026
